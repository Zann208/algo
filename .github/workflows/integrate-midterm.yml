name: Integrate midterm into ALGO console

on:
  push:
    paths:
      - '.github/workflows/integrate-midterm.yml'

permissions:
  contents: write

jobs:
  patch-console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add Midterm navigation and refresh scope
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Native Midterm section in the existing left sidebar.
          if 'href="midterm.html"' not in s:
              marker = '  <div class="navgroup">Assignments</div>'
              insert = '''  <div class="navgroup">Midterm</div>
  <a class="navbtn" href="midterm.html" style="text-decoration:none"><span class="dot" style="background:var(--am)"></span>Exam definitions<span class="num">MID</span></a>

'''
              if marker not in s:
                  raise SystemExit('Sidebar insertion marker not found')
              s = s.replace(marker, insert + marker, 1)

          # Keep the home console aligned with the current posted scope.
          s = s.replace(
              'Everything here comes from the Week 1–4 slides and Worksheets 1–2. Nothing extra.',
              'Everything here is organized around the posted midterm material: Weeks 1, 2, 3, 4 and 6, plus Worksheets 1–2.'
          )
          s = s.replace(
              '<div class="stat s-blue"><div class="n">4</div><div class="l">Topics</div></div>',
              '<div class="stat s-blue"><div class="n">5</div><div class="l">Topics</div></div>',
              1
          )

          week4 = '<p><b>Week 4:</b> Trees, Binary Trees, Binary Search Trees (BST). Traversal. Insertion and deletion. Balancing: DSW and AVL. Splay trees. Heaps and heapsort. Expression trees.</p>'
          week6 = '<p><b>Week 6:</b> Multiway trees. B-Trees, B*, B**, B+, Prefix B+ and Bit Trees. Tries.</p>'
          if week6 not in s and week4 in s:
              s = s.replace(week4, week4 + '\n    ' + week6, 1)

          # Put the new exam bank directly on the home-page exam card.
          midterm_cta = '<p style="margin-top:15px"><a class="btn b-yel" href="midterm.html" style="display:inline-block;text-decoration:none">MIDTERM · EXAM DEFINITIONS →</a></p>'
          if midterm_cta not in s and week6 in s:
              s = s.replace(week6, week6 + '\n    ' + midterm_cta, 1)

          s = s.replace(
              '<li><b>Read a level</b> (Week 1 → 4). Each one explains every topic in simple words, with code.</li>',
              '<li><b>Read a level</b> (Weeks 1, 2, 3, 4 and 6). Each one explains every topic in simple words, with code.</li>',
              1
          )

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit console integration
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Integrate Midterm section into ALGO console"
          git push
