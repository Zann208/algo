name: ALGO native midterm patch
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch index through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}

          def get(path):
              api=f'https://api.github.com/repos/{repo}/contents/{path}'
              req=urllib.request.Request(api,headers=headers)
              with urllib.request.urlopen(req) as r: return api,json.load(r)

          def put(api, sha, content, message):
              payload=json.dumps({'message':message,'content':base64.b64encode(content.encode()).decode(),'sha':sha}).encode()
              req=urllib.request.Request(api,data=payload,headers={**headers,'Content-Type':'application/json'},method='PUT')
              with urllib.request.urlopen(req) as r: return json.load(r)

          api,d=get('index.html')
          s=base64.b64decode(d['content']).decode()

          old='<a class="navbtn" href="midterm.html" style="text-decoration:none"><span class="dot" style="background:var(--am)"></span>Exam definitions<span class="num">MID</span></a>'
          new='<button class="navbtn" data-page="midterm" onclick="go(\'midterm\')"><span class="dot" style="background:var(--am)"></span>Exam definitions<span class="num">MID</span></button>'
          s=s.replace(old,new,1)

          oldcta='<p style="margin-top:15px"><a class="btn b-yel" href="midterm.html" style="display:inline-block;text-decoration:none">MIDTERM · EXAM DEFINITIONS →</a></p>'
          newcta='<p style="margin-top:15px"><button class="btn b-yel" onclick="go(\'midterm\')">MIDTERM · EXAM DEFINITIONS →</button></p>'
          s=s.replace(oldcta,newcta,1)

          if 'id="page-midterm"' not in s:
              marker='<!-- ===== CHEAT ===== -->'
              section='''<!-- ===== MIDTERM ===== -->
<section class="page" id="page-midterm">
  <div class="lvlchip c-red">Midterm · Exam Definition Bank</div>
  <h1>Midterm — Exam Definitions</h1>
  <p class="sub">Weeks 1, 2, 3, 4 and 6 — short formal definitions written for exam answers.</p>
  <div class="box notes"><span class="tag">★ Exam technique</span>Write the one-sentence definition first. Add one key property or tiny example only after the definition.</div>
  <div class="card" style="padding:0;overflow:hidden">
    <iframe src="midterm.html" title="ALGO Midterm Exam Definitions" style="display:block;width:100%;height:78vh;min-height:720px;border:0;background:var(--bg)"></iframe>
  </div>
</section>

'''
              if marker not in s: raise SystemExit('cheat marker missing')
              s=s.replace(marker,section+marker,1)

          put(api,d['sha'],s,'Make Midterm an internal ALGO console tab')
          print('index patched')

          # Disable this one-time workflow so future content pushes do not re-run it.
          wapi,wd=get('.github/workflows/sidebar-patch.yml')
          w=base64.b64decode(wd['content']).decode()
          w=w.replace('on: [push]','on: [workflow_dispatch]',1)
          put(wapi,wd['sha'],w,'Disable one-time Midterm patch workflow')
          print('workflow disabled')
          PY
