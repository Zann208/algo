name: Apply reviewed ALGO midterm upgrade

on:
  push:
    paths:
      - '.github/workflows/apply-algo-midterm-upgrade.yml'

permissions:
  contents: write

concurrency:
  group: algo-reviewed-midterm-upgrade
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct reviewed migration
        run: |
          cat scripts/.algo-v2-part* | base64 -d | gzip -d > /tmp/apply_algo_midterm.py
          python /tmp/apply_algo_midterm.py
      - name: Validate JavaScript and required content
        run: |
          node --check tree-mastery.js
          node --check assignment3.js
          node --check tree-mastery-upgrade.js
          node --check tree-mastery-learn-expanded.js
          node --check midterm-mock.js
          grep -q 'Midterm Mock' index.html
          grep -q 'C–F = 9' docs/MIDTERM-MOCK-AUDIT.md
          grep -q 'D–E = 8' docs/MIDTERM-MOCK-AUDIT.md
          grep -q 'sc-embedded' study-console-adapter.css
      - name: Commit reviewed upgrade
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html study-console-adapter.css tree-mastery-learn-expanded.js midterm-mock.html midterm-mock.css midterm-mock.js docs README.md MIDTERM.md
          git commit -m 'Add verified ALGO midterm mock and expanded Tree Mastery'
          git push
