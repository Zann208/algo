name: Apply reviewed midterm readability pass

on:
  push:
    paths:
      - '.github/workflows/apply-midterm-readability.yml'

permissions:
  contents: write

concurrency:
  group: algo-midterm-readability
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply presentation-only readability patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          css_b64 = ''''''

          js_b64 = ''''''

          Path('midterm-mock.css').write_bytes(base64.b64decode(css_b64))
          Path('midterm-mock-readability.js').write_bytes(base64.b64decode(js_b64))

          p = Path('midterm-mock.html')
          before = p.read_text(encoding='utf-8')
          needle = '<script src="./midterm-mock.js"></script>'
          addition = needle + '\n<script src="./midterm-mock-readability.js"></script>'
          if '<script src="./midterm-mock-readability.js"></script>' not in before:
              if before.count(needle) != 1:
                  raise SystemExit('Expected exactly one midterm-mock.js script tag')
              after = before.replace(needle, addition, 1)
              if after.replace('\n<script src="./midterm-mock-readability.js"></script>', '', 1) != before:
                  raise SystemExit('HTML integrity check failed')
              p.write_text(after, encoding='utf-8')
          PY

      - name: Validate readability-only scope
        run: |
          node --check midterm-mock-readability.js
          node --check midterm-mock.js
          python - <<'PY'
          from pathlib import Path
          css=Path('midterm-mock.css').read_text(encoding='utf-8')
          html=Path('midterm-mock.html').read_text(encoding='utf-8')
          assert css.count('{') == css.count('}')
          assert 'var(--sc-header)' not in css
          assert 'var(--sc-header-h)' in css
          assert html.count('midterm-mock-readability.js') == 1
          # Preserve the already-reviewed corrected mock values/operations.
          required = [
            'Access 4, then insert 16',
            'DELETE value 81',
            'C–F = <strong>9</strong>',
            'D–E = <strong>8</strong>',
          ]
          missing=[x for x in required if x not in html]
          if missing:
              raise SystemExit('Corrected mock markers missing: '+repr(missing))
          PY
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = $'midterm-mock.css\nmidterm-mock-readability.js\nmidterm-mock.html' || {
            echo 'Unexpected changed files'; exit 1;
          }

      - name: Commit readability pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add midterm-mock.css midterm-mock-readability.js midterm-mock.html
          git commit -m "Improve ALGO midterm mock readability"
          git push
