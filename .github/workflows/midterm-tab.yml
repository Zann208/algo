name: Midterm tab patch
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch index through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, json, base64, urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          api=f'https://api.github.com/repos/{repo}/contents/index.html'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          req=urllib.request.Request(api,headers=headers)
          with urllib.request.urlopen(req) as r: d=json.load(r)
          s=base64.b64decode(d['content']).decode()
          before=s
          s=s.replace('<a class="navbtn" href="midterm.html" style="text-decoration:none"><span class="dot" style="background:var(--am)"></span>Exam definitions<span class="num">MID</span></a>','<button class="navbtn" data-page="midterm" onclick="go(\'midterm\')"><span class="dot" style="background:var(--am)"></span>Exam definitions<span class="num">MID</span></button>',1)
          s=s.replace('<p style="margin-top:15px"><a class="btn b-yel" href="midterm.html" style="display:inline-block;text-decoration:none">MIDTERM · EXAM DEFINITIONS →</a></p>','<p style="margin-top:15px"><button class="btn b-yel" onclick="go(\'midterm\')">MIDTERM · EXAM DEFINITIONS →</button></p>',1)
          marker='<!-- ===== CHEAT ===== -->'
          section='<!-- ===== MIDTERM ===== -->\n<section class="page" id="page-midterm">\n  <div class="lvlchip c-red">Midterm · Exam Definition Bank</div>\n  <h1>Midterm — Exam Definitions</h1>\n  <p class="sub">Weeks 1, 2, 3, 4 and 6 — short formal definitions written for exam answers.</p>\n  <div class="box notes"><span class="tag">★ Exam technique</span>Write the one-sentence definition first. Add one key property or tiny example only after the definition.</div>\n  <div class="card" style="padding:0;overflow:hidden">\n    <iframe src="midterm.html" title="ALGO Midterm Exam Definitions" style="display:block;width:100%;height:78vh;min-height:720px;border:0;background:var(--bg)"></iframe>\n  </div>\n</section>\n\n'
          if 'id="page-midterm"' not in s and marker in s: s=s.replace(marker,section+marker,1)
          if s!=before:
              payload=json.dumps({'message':'Make Midterm an internal ALGO console tab','content':base64.b64encode(s.encode()).decode(),'sha':d['sha']}).encode()
              req=urllib.request.Request(api,data=payload,headers={**headers,'Content-Type':'application/json'},method='PUT')
              with urllib.request.urlopen(req) as r: print(json.load(r)['commit']['sha'])
          else:
              print('No changes needed')
          PY
