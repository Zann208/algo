name: Fix Midterm Mock navigation scroll

on:
  push:
    paths:
      - '.github/workflows/fix-midterm-navigation-scroll.yml'

permissions:
  contents: write

concurrency:
  group: algo-midterm-scroll-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve viewport on previous and next
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('midterm-mock.js')
          s=p.read_text(encoding='utf-8')

          replacements=[
            (
              "function setTake(index){\n  document.body.classList.remove('review-mode');",
              "function setTake(index,{preserveScroll=false}={}){\n  const lockedScrollY=preserveScroll?window.scrollY:null;\n  const lockedScrollX=preserveScroll?window.scrollX:null;\n  document.body.classList.remove('review-mode');"
            ),
            (
              "  save();window.scrollTo({top:0,behavior:'smooth'});\n}",
              "  save();\n  if(preserveScroll){\n    requestAnimationFrame(()=>requestAnimationFrame(()=>{\n      const root=document.documentElement;\n      const previousBehavior=root.style.scrollBehavior;\n      root.style.scrollBehavior='auto';\n      window.scrollTo(lockedScrollX,lockedScrollY);\n      root.style.scrollBehavior=previousBehavior;\n    }));\n  }else{\n    window.scrollTo({top:0,behavior:'smooth'});\n  }\n}"
            ),
            (
              "  if(state.current<cards.length-1) setTake(state.current+1);",
              "  if(state.current<cards.length-1) setTake(state.current+1,{preserveScroll:true});"
            ),
            (
              "document.querySelectorAll('[data-prev]').forEach(b=>b.addEventListener('click',()=>setTake(state.current-1)));",
              "document.querySelectorAll('[data-prev]').forEach(b=>b.addEventListener('click',()=>setTake(state.current-1,{preserveScroll:true})));"
            ),
          ]

          for old,new in replacements:
            count=s.count(old)
            if count!=1:
              raise SystemExit(f'Expected one match, found {count}: {old[:80]}')
            s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate focused change
        run: |
          node --check midterm-mock.js
          python - <<'PY'
          from pathlib import Path
          s=Path('midterm-mock.js').read_text(encoding='utf-8')
          assert "setTake(state.current+1,{preserveScroll:true})" in s
          assert "setTake(state.current-1,{preserveScroll:true})" in s
          assert "lockedScrollY=preserveScroll?window.scrollY:null" in s
          assert "window.scrollTo(lockedScrollX,lockedScrollY)" in s
          # Academic tree data and renderer remain present and untouched by intent.
          for marker in ["bst0:{v:23", "avl0:{v:10", "splay0:{v:11", "function renderTree(root)"]:
            assert marker in s
          PY
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "midterm-mock.js"

      - name: Commit scroll-position fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add midterm-mock.js
          git commit -m "Preserve Midterm Mock position between questions"
          git push
