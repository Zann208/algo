name: Flatten ALGO console

on:
  push:
    paths:
      - '.github/workflows/flatten-console.yml'

permissions:
  contents: write

jobs:
  flatten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build self-contained entry page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('legacy.html').read_text(encoding='utf-8')
          scripts = '''
          <script src="./tree-mastery.js?v=20260823b"></script>
          <script src="./assignment3.js?v=20260823b"></script>
          <script src="./tree-mastery-upgrade.js?v=20260823b"></script>
          '''
          html = html.replace('</body>', scripts + '\n</body>')
          Path('index.html').write_text(html, encoding='utf-8')
          PY
      - name: Add static hosting marker
        run: touch .nojekyll
      - name: Commit stabilized entry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .nojekyll
          git commit -m "Stabilize ALGO self-contained entry" || exit 0
          git push
