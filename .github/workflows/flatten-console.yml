name: ALGO console validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate interactive JavaScript
        run: |
          node --check tree-mastery.js
          node --check assignment3.js
          node --check tree-mastery-upgrade.js
          node --check tree-mastery-learn-expanded.js
          node --check midterm-mock.js
      - name: Verify required pages
        run: |
          test -f index.html
          test -f midterm.html
          test -f midterm-mock.html
          test -f study-console-adapter.css
