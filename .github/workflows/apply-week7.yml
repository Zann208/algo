name: Apply Week 7 Graphs

on:
  push:
    paths:
      - '.github/workflows/apply-week7.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply tested Week 7 patch
        run: |
          echo '' | base64 -d | gzip -d > /tmp/week7.patch
          git apply --check /tmp/week7.patch
          git apply /tmp/week7.patch
      - name: Validate console JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=[m.group(1) for m in re.finditer(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)]
          Path('/tmp/all-scripts.js').write_text('\n'.join(scripts))
          assert 'id="page-week7"' in s
          assert 'data-fw="7"' in s
          assert 'qzStart(7' in s
          assert 'Graphs — Week 7 quick reference' in s
          PY
          node --check /tmp/all-scripts.js
          git diff --check
      - name: Commit Week 7 update
        run: |
          git config user.name "Zann"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git commit -m "Add Week 7 graphs to ALGO console"
          git push
